{% extends "base.html" %}{% block title %}Join Kelz{% endblock %}{% block content %}<section class="form-shell"><p class="eyebrow">YOUR CREATIVE HOME</p><h1>Create account</h1>{% if error %}<div class="mb-5 rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-800" role="alert">{{ error }}</div>{% endif %}<form method="post"><label>Name<input class="rounded-lg border border-gray-300 bg-transparent p-3.5 text-sm focus:border-kelz-coral focus:ring-kelz-coral" name="name" required minlength="2"></label><label>Email<input class="rounded-lg border border-gray-300 bg-transparent p-3.5 text-sm focus:border-kelz-coral focus:ring-kelz-coral" name="email" type="email" required></label><label>Password<input class="rounded-lg border border-gray-300 bg-transparent p-3.5 text-sm focus:border-kelz-coral focus:ring-kelz-coral" name="password" type="password" required minlength="8"></label><button class="button rounded-lg" type="submit">Join studio</button></form><p class="muted">Already have an account? <a href="/auth/login">Log in</a></p></section>{% endblock %}
