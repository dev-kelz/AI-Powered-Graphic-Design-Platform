{% extends "base.html" %}
{% block title %}Log in | Kelz{% endblock %}
{% block content %}
<section class="form-shell">
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Log in</h1>
    {% if error %}
    <div class="mb-5 rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-800" role="alert">
        {{ error }}
    </div>
    {% endif %}
    <form method="post">
        <label>Email
            <input class="rounded-lg border border-gray-300 bg-transparent p-3.5 text-sm focus:border-kelz-coral focus:ring-kelz-coral" name="email" type="email" required>
        </label>
            <label>Password
                <input class="rounded-lg border border-gray-300 bg-transparent p-3.5 text-sm focus:border-kelz-coral focus:ring-kelz-coral" name="password" type="password" required>
            </label>
            <button class="button rounded-lg" type="submit">Log in

            </button>
        </form>
        <p class="muted">New here? <a href="/auth/register">Create an account</a></p>
    </section>
    {% endblock %}
