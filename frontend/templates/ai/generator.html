{% extends "base.html" %}
{% block title %}Create | Kelz{% endblock %}
{% block content %}
<section class="generator">
    <p class="eyebrow">AI GENERATOR</p>
    <h1>What are you<br><em>imagining?</em></h1>
    <form method="post" action="/ai/generate">
        <label for="prompt">Describe the visual</label>
        <textarea class="rounded-lg border border-gray-300 bg-transparent p-4 text-sm focus:border-kelz-coral focus:ring-kelz-coral" id="prompt" name="prompt" placeholder="A bold editorial poster for a night market..." required></textarea>
        <button class="button rounded-lg" type="submit">Generate concept</button>
    </form>
    <p class="muted">Your first concept is saved to your private workspace.</p>
</section>
    {% endblock %}
